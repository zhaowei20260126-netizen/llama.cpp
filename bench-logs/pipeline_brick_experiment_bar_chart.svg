<text x="800.0" y="1102" text-anchor="middle" class="tiny muted">结论: pipeline dense 相比 baseline 生成吞吐约 1.31x；stream-kv 相比 pipeline dense 约 1.11x；stream-kv 相比 baseline 约 1.46x。</text>
